name: itier-infra
runtime:
  name: nodejs
  options:
    packagemanager: npm
description: >
  Despliegue de servicios de iTier detrás de un Cloudflare Tunnel.
  Pulumi maneja el túnel, su ingress y el DNS; opcionalmente empuja el
  stack de docker-compose al VPS por SSH. El SSL lo termina Cloudflare:
  no hay certificados ni puertos abiertos en el VPS.

# Config no-secreta con valores por defecto para el stack de demo.
# Los secretos (API token de Cloudflare, clave SSH) se cargan aparte con
#   pulumi config set --secret <clave> <valor>
config:
  itier-infra:hostname:
    description: Hostname público que sirve la landing (proxied por Cloudflare).
    default: demo.itier.pymesenlinea.com.ar
  itier-infra:tunnelName:
    description: Nombre del Cloudflare Tunnel.
    default: itier-demo
  itier-infra:landingImage:
    description: Imagen de la landing publicada en GHCR.
    default: ghcr.io/pel-matiasvaldivia/itier-landing:latest
  itier-infra:deployToVps:
    description: Si es true, Pulumi copia el compose y corre `docker compose up` por SSH.
    default: false
