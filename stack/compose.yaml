# iTier — stack de demo en el VPS, detrás del túnel Cloudflare YA EXISTENTE.
#
# Reusa el túnel "DW-Services" (gestionado desde el dashboard) y su connector
# `cloudflared` (contenedor `cloudflared-tunnel`, proyecto `tunnel`), que ya
# corre en el VPS sobre la red `tunnel_default`. Este stack NO levanta otro
# cloudflared: engancha Traefik + la landing a esa MISMA red `tunnel_default`,
# así el cloudflared existente alcanza a Traefik por su nombre de contenedor.
#
# Flujo:
#   internet ──HTTPS──> Cloudflare (termina TLS) ──túnel──> cloudflared-tunnel
#                                                              │ red `tunnel_default`
#                                                           Traefik ──> landing
#
# En el dashboard del túnel agregás un Public Hostname:
#   demo.itier.pymesenlinea.com.ar  →  http://itier-traefik:80
# (ver README.md). Traefik rutea por Host con los labels de acá.
#
# NO se publica ningún puerto: cloudflared sale hacia Cloudflare y Traefik solo
# es alcanzable dentro de la red `tunnel_default`. No hay que crear ninguna red:
# `tunnel_default` ya existe (la creó el compose del túnel).
#
# Variables (ver .env.example):
#   LANDING_IMAGE  imagen de la landing en GHCR
#   LANDING_HOST   hostname público (igual al Public Hostname del túnel)

name: itier-demo

x-comun: &comun
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

services:

  # ── Reverse proxy interno. Rutea por labels de Docker. SIN TLS (lo hizo CF) ──
  # El cloudflared existente lo alcanza por su container_name en `tunnel_default`:
  #   Public Hostname del túnel  →  http://itier-traefik:80
  traefik:
    <<: *comun
    image: traefik:v3.3
    container_name: itier-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=tunnel_default
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
    volumes:
      # Read-only: Traefik solo lee eventos de Docker para descubrir servicios.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [tunnel]

  # ── La landing de iTier (sitio estático servido por nginx) ──────────────────
  landing:
    <<: *comun
    image: ${LANDING_IMAGE:-ghcr.io/pel-matiasvaldivia/itier-landing:latest}
    container_name: itier-landing
    labels:
      - traefik.enable=true
      - traefik.http.routers.landing.rule=Host(`${LANDING_HOST:?falta LANDING_HOST}`)
      - traefik.http.routers.landing.entrypoints=web
      - traefik.http.services.landing.loadbalancer.server.port=80
    networks: [tunnel]

# Red del túnel existente (proyecto `tunnel`). Es EXTERNA: ya la creó el compose
# del cloudflared, así que este stack solo se engancha a ella. No hay que crearla.
networks:
  tunnel:
    external: true
    name: tunnel_default
