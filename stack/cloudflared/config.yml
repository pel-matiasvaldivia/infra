# Config del túnel (túnel gestionado localmente, sin Pulumi ni dashboard).
#
# Reemplazá <TUNNEL_UUID> por el UUID que te da `cloudflared tunnel create`
# (ver stack/cloudflared/README.md). El UUID no es secreto; el secreto es
# creds.json (gitignored).
#
# Ingress "catch-all": TODO el tráfico del túnel entra a Traefik, que rutea por
# Host con los labels del compose. Así, agregar un servicio nuevo NO toca este
# archivo: solo sumás un CNAME en Cloudflare y un label en compose.yaml.

tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/creds.json

ingress:
  - service: http://traefik:80
