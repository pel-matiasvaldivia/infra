# nginx para la landing de iTier, detrás de Cloudflare Tunnel + Traefik.
# HTTP plano en :80 (el TLS lo terminó Cloudflare). Va en itier/landing/nginx.conf.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck interno para Docker / Traefik (no aparece en logs de acceso).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cabeceras de seguridad. Como Cloudflare está delante, el HSTS lo puede
    # manejar Cloudflare; acá van las que dependen del contenido.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
}
