# Stack de PRODUCCIÓN multi-servicio en el VPS de Azure, detrás de un túnel
# Cloudflare NUEVO y DEDICADO (ej. "azure-prod"), gestionado desde el dashboard.
#
# A diferencia de la demo (carpeta ../stack), acá el VPS es nuevo: no hay ningún
# cloudflared corriendo, así que este compose levanta el suyo. Un solo túnel +
# un solo Traefik sirven TODOS los dominios; Traefik rutea por Host.
#
# Flujo:
#   internet ──HTTPS──> Cloudflare (termina TLS)
#     dominioA.com, dominioB.com, ... (cada uno = un Public Hostname del túnel)
#        └──túnel saliente──> cloudflared ──red `web`──> Traefik ──┬─> app1
#                                                                  └─> app2
#
# En el dashboard del túnel, TODOS los Public Hostnames apuntan al MISMO Traefik:
#   dominioA.com  →  HTTP  →  traefik:80
#   dominioB.com  →  HTTP  →  traefik:80
# y Traefik decide a qué contenedor va cada uno según el Host (labels de acá).
#
# NO se publica ningún puerto: cloudflared sale hacia Cloudflare y nada entra al
# VPS. No hace falta IP pública, ni 80/443 abiertos, ni certificados en el origen.
#
# Para AGREGAR UN SERVICIO (ver README.md): copiás un bloque de servicio, le
# ponés su imagen y su `Host(...)`, cargás el Public Hostname en el dashboard y
# el CNAME en DNS. Nada más.

name: prod

x-comun: &comun
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

services:

  # ── Connector del túnel. Sale hacia Cloudflare con el token (gestionado desde
  #    el dashboard). Los Public Hostnames se cargan en el dashboard apuntando a
  #    http://traefik:80. No publica puertos: solo conexiones salientes. ────────
  cloudflared:
    <<: *comun
    image: cloudflare/cloudflared:2025.2.1
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?falta TUNNEL_TOKEN}
    networks: [web]

  # ── Reverse proxy interno. Rutea por labels de Docker. SIN TLS (lo hizo CF) ──
  # cloudflared lo alcanza como `traefik:80` dentro de la red `web`.
  traefik:
    <<: *comun
    image: traefik:v3.3
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=prod_web
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
    volumes:
      # Read-only: Traefik solo lee eventos de Docker para descubrir servicios.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]

  # ── Servicio de ejemplo nº 1 ────────────────────────────────────────────────
  # Reemplazá `image` por tu servicio real y `APP1_HOST` por su dominio.
  # whoami responde en :80 (útil para probar que el túnel + Traefik funcionan).
  app1:
    <<: *comun
    image: traefik/whoami:v1.10
    container_name: app1
    labels:
      - traefik.enable=true
      - traefik.http.routers.app1.rule=Host(`${APP1_HOST:?falta APP1_HOST}`)
      - traefik.http.routers.app1.entrypoints=web
      - traefik.http.services.app1.loadbalancer.server.port=80
    networks: [web]

  # ── Servicio de ejemplo nº 2 (otro dominio) ─────────────────────────────────
  app2:
    <<: *comun
    image: traefik/whoami:v1.10
    container_name: app2
    labels:
      - traefik.enable=true
      - traefik.http.routers.app2.rule=Host(`${APP2_HOST:?falta APP2_HOST}`)
      - traefik.http.routers.app2.entrypoints=web
      - traefik.http.services.app2.loadbalancer.server.port=80
    networks: [web]

# Red interna que crea este compose (nombre real: `prod_web`). cloudflared,
# Traefik y los servicios se ven entre sí por nombre de contenedor dentro de ella.
networks:
  web:
    name: prod_web
