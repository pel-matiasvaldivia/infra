name: deploy-landing

# Construye y publica la imagen de la landing a GHCR y (opcional) la despliega
# en el VPS por SSH. Va en itier/.github/workflows/deploy-landing.yml.
#
# El despliegue por SSH solo corre si están cargados los secrets del repo:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY   (Settings → Secrets and variables → Actions)
# Sin esos secrets, el workflow solo construye y publica la imagen.

on:
  push:
    branches: ['main', 'master']
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/itier-landing

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # Login solo cuando vamos a publicar (no en pull requests).
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir (y publicar si no es PR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: landing
          file: landing/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Despliegue en el VPS: SSH → docker compose pull && up. Opcional. ────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Solo en la rama por defecto y si hay host configurado.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Actualizar el stack en el VPS
        # Guardas: si no hay secret VPS_HOST, saltea sin fallar.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/itier-demo
            docker compose --env-file .env pull landing
            docker compose --env-file .env up -d landing
            docker image prune -f
